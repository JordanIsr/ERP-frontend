<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>ERP Institucional</h2>
      <p>Inicie sesión en su cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="cedula">Usuario (cédula)</label>
        <input 
          id="cedula" 
          type="text"
          inputmode="numeric"
          autocomplete="username"
          maxlength="10"
          formControlName="cedula"
          (input)="soloDigitos($event)"
          placeholder="Los 10 dígitos de su cédula"
          [class.is-invalid]="loginForm.get('cedula')?.invalid && loginForm.get('cedula')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('cedula')?.invalid && loginForm.get('cedula')?.touched">
          <span *ngIf="loginForm.get('cedula')?.errors?.['required']">El usuario (cédula) es obligatorio.</span>
          <span *ngIf="loginForm.get('cedula')?.errors?.['pattern']">Ingrese exactamente los 10 dígitos de su cédula; no se permiten letras.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          autocomplete="current-password"
          maxlength="100"
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</span>
          <span *ngIf="loginForm.get('password')?.errors?.['maxlength']">Máximo 100 caracteres.</span>
        </div>
      </div>

      <div class="backend-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Ingresando...' : 'Ingresar al Sistema' }}
      </button>

      <div class="register-link">
        ¿No tienes una cuenta? 
        <a routerLink="/register">Regístrate aquí</a>
      </div>

    </form>
  </div>
</div>
